<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>CRFX Arcade — 遊戲機</title>
<style>
  :root{
    --bg:#05060f; --ink:#eaf6ff; --dim:#8b9ac4;
    --accent:#5ce1e6; --gold:#ffd93d;
    --card:rgba(255,255,255,.045);
    --line:rgba(140,180,255,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg); color:var(--ink); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",system-ui,sans-serif;
    padding:0 0 70px; overflow-x:hidden;
  }
  /* ---------- ambient background ---------- */
  #bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
  #bg i{position:absolute;border-radius:50%;filter:blur(72px);opacity:.5;
        animation:float 22s ease-in-out infinite}
  #bg i:nth-child(1){width:460px;height:460px;background:#1b2f6e;top:-160px;left:-90px}
  #bg i:nth-child(2){width:380px;height:380px;background:#5b2360;top:14%;right:-130px;
        animation-delay:-7s}
  #bg i:nth-child(3){width:420px;height:420px;background:#0d4f5c;bottom:-140px;left:26%;
        animation-delay:-13s}
  @keyframes float{
    0%,100%{transform:translate(0,0) scale(1)}
    33%    {transform:translate(38px,-30px) scale(1.11)}
    66%    {transform:translate(-30px,26px) scale(.93)}
  }

  /* ---------- header ---------- */
  header{max-width:1180px;margin:0 auto;padding:clamp(26px,5.5vh,54px) 22px 20px}
  .brand{display:flex;align-items:center;gap:13px;margin-bottom:18px;flex-wrap:wrap}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 16px var(--accent);animation:pulse 2.1s ease-in-out infinite;flex:0 0 auto}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  .brand span{font-size:12.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--dim);font-weight:700}
  h1{font-size:clamp(32px,8vw,54px);font-weight:900;line-height:1.05;letter-spacing:-.015em}
  h1 em{font-style:normal;background:linear-gradient(120deg,#7ef0f5,#5ce1e6 42%,#a78bfa);
        -webkit-background-clip:text;background-clip:text;color:transparent}
  .lede{margin-top:11px;font-size:clamp(13.5px,3.5vw,15.5px);color:var(--dim);
        line-height:1.8;max-width:38em}
  .meta{margin-top:15px;display:flex;gap:9px;flex-wrap:wrap}
  .chip{font-size:12px;padding:6px 14px;border-radius:999px;color:var(--dim);
        border:1px solid var(--line);background:rgba(255,255,255,.03);letter-spacing:.04em}
  .chip b{color:var(--accent);font-weight:800}

  /* ---------- grid ---------- */
  main{max-width:1180px;margin:0 auto;padding:8px 22px 0}
  .grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(298px,1fr))}
  a.card{
    display:flex;flex-direction:column;text-decoration:none;color:inherit;
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    overflow:hidden;position:relative;
    transition:transform .19s cubic-bezier(.2,.7,.3,1),border-color .19s,box-shadow .19s;
    backdrop-filter:blur(9px);
  }
  a.card:hover{transform:translateY(-5px);border-color:rgba(92,225,230,.5);
    box-shadow:0 20px 52px rgba(0,0,0,.5),0 0 0 1px rgba(92,225,230,.2)}
  a.card:active{transform:translateY(-2px) scale(.99)}
  .thumb{aspect-ratio:16/9;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 45%,color-mix(in srgb,var(--ac) 26%,transparent),#0a0d1e 72%)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .emoji{font-size:54px;filter:drop-shadow(0 6px 22px rgba(0,0,0,.6))}
  .thumb .glow{position:absolute;width:170px;height:170px;border-radius:50%;
    background:var(--ac);filter:blur(58px);opacity:.34}
  .badge{position:absolute;top:11px;right:11px;font-size:10.5px;font-weight:800;
    letter-spacing:.13em;text-transform:uppercase;padding:5px 11px;border-radius:999px;
    z-index:2;backdrop-filter:blur(7px)}
  .badge.playable{background:rgba(92,225,230,.2);color:#9df3f7;box-shadow:inset 0 0 0 1px rgba(92,225,230,.42)}
  .badge.wip{background:rgba(255,217,61,.16);color:#ffe480;box-shadow:inset 0 0 0 1px rgba(255,217,61,.38)}
  .badge.soon{background:rgba(255,255,255,.08);color:var(--dim);box-shadow:inset 0 0 0 1px var(--line)}
  .body{padding:17px 18px 19px;display:flex;flex-direction:column;gap:9px;flex:1}
  .t{font-size:19px;font-weight:850;letter-spacing:-.01em;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .t small{font-size:12.5px;font-weight:600;color:var(--dim);letter-spacing:.02em}
  .d{font-size:13.5px;line-height:1.72;color:#b9c6e6;flex:1}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
  .tags i{font-style:normal;font-size:11px;padding:3.5px 10px;border-radius:7px;
    background:rgba(255,255,255,.055);color:var(--dim);letter-spacing:.03em}
  .foot{display:flex;align-items:center;justify-content:space-between;
    margin-top:5px;padding-top:12px;border-top:1px solid var(--line)}
  .foot .facts{font-size:11.5px;color:var(--dim);letter-spacing:.04em}
  .play{font-size:13px;font-weight:800;color:var(--accent);letter-spacing:.05em;
    display:flex;align-items:center;gap:6px;transition:gap .18s}
  a.card:hover .play{gap:10px}

  /* ---------- empty / footer ---------- */
  .empty{max-width:1180px;margin:0 auto;padding:60px 22px;text-align:center;color:var(--dim)}
  footer{max-width:1180px;margin:64px auto 0;padding:26px 22px 0;
    border-top:1px solid var(--line);display:flex;justify-content:space-between;
    gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--dim);letter-spacing:.03em}
  footer a{color:var(--dim);text-decoration:none}
  footer a:hover{color:var(--accent)}
</style>
</head>
<body>
<div id="bg"><i></i><i></i><i></i></div>

<header>
  <div class="brand"><span class="dot"></span><span>CRFX Solution Limited</span></div>
  <h1>遊戲<em>機</em></h1>
  <p class="lede">
    自己做起嚟嘅小遊戲。冇廣告、冇追蹤、冇內購 —— 打開就玩。
    全部係單一 HTML 檔，離線都玩到。
  </p>
  <div class="meta" id="meta"></div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">
    <p>仲未有遊戲。加一個入 <code>games.js</code> 就得。</p>
  </div>
</main>

<footer>
  <div>© CRFX Solution Limited</div>
  <div id="built"></div>
</footer>

<script src="games.js"></script>
<script>
"use strict";

const STATUS_TEXT = { playable:"玩得", wip:"整緊", soon:"敬請期待" };

function cardHTML(g, i){
  const accent = g.accent || "#5ce1e6";
  const thumb  = g.thumb
    ? `<img src="${g.thumb}" alt="${g.title}" loading="lazy">`
    : `<div class="glow"></div><div class="emoji">${g.emoji || "🎮"}</div>`;

  const st = g.status || "playable";
  const badge = `<div class="badge ${st}">${STATUS_TEXT[st] || st}</div>`;

  const tags = (g.tags || []).map(t => `<i>${t}</i>`).join("");
  const clickable = st !== "soon";

  const inner = `
    <div class="thumb" style="--ac:${accent}">${thumb}${badge}</div>
    <div class="body">
      <div class="t">${g.title}${g.title_zh ? `<small>${g.title_zh}</small>` : ""}</div>
      <div class="d">${g.tagline || ""}</div>
      <div class="tags">${tags}</div>
      <div class="foot">
        <div class="facts">${[g.players, g.minutes].filter(Boolean).join(" · ")}</div>
        <div class="play">${clickable ? "開始 ▸" : "等等 ▸"}</div>
      </div>
    </div>`;

  const href = g.path || "#";
  return clickable
    ? `<a class="card" href="${href}">${inner}</a>`
    : `<a class="card" href="#" onclick="return false" style="opacity:.62">${inner}</a>`;
}

function render(){
  const games = (window.GAMES || []).slice().sort((a,b)=>
    (a.status === "soon") - (b.status === "soon") || (b.added||"").localeCompare(a.added||""));

  const grid = document.getElementById("grid");
  grid.innerHTML = games.map(cardHTML).join("");
  document.getElementById("empty").style.display = games.length ? "none" : "block";

  const playable = games.filter(g => (g.status||"playable") === "playable").length;
  document.getElementById("meta").innerHTML = [
    `<div class="chip">總共 <b>${games.length}</b> 隻</div>`,
    `<div class="chip">玩得 <b>${playable}</b> 隻</div>`,
    `<div class="chip">全部 <b>離線玩到</b></div>`,
  ].join("");

  document.getElementById("built").textContent =
    "更新 " + new Date().toISOString().slice(0,10);
}

render();
</script>
</body>
</html>

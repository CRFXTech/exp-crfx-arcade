<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>貓咪星球 · 貓咪尋找謎題</title>
<style>
  :root {
    --bg: #FFF8F0;
    --cell-bg: #FFFFFF;
    --cell-border: #FFFFFF;
    --pill-bg: #FFFFFF;
    --text: #2D2D2D;
    --accent: #FFB7C5;
    --success: #A5D6A7;
    --error: #EF9A9A;
    --shadow: rgba(0,0,0,0.08);
    --highlight: #FFD93D;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  h1 {
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 4px;
    letter-spacing: -0.5px;
  }

  .subtitle {
    font-size: 0.8rem;
    color: #888;
    margin-bottom: 12px;
  }

  /* ── Top bar ── */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 400px;
    margin-bottom: 12px;
    gap: 8px;
  }

  .pill {
    background: var(--pill-bg);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    box-shadow: 0 2px 6px var(--shadow);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .pill .count {
    font-size: 1.1rem;
    font-weight: 800;
    color: #999;
  }

  .pill .count.green { color: #66BB6A; }
  .pill .count.red { color: #E53935; }

  .hearts { display: flex; gap: 2px; }
  .heart { font-size: 1rem; transition: transform 0.2s; }
  .heart.lost { opacity: 0.3; transform: scale(0.8); }

  /* ── Game board ── */
  .board-wrapper {
    position: relative;
    width: 100%;
    max-width: 400px;
    aspect-ratio: 1;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    gap: 3px;
    width: 100%;
    height: 100%;
    background: var(--cell-border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 16px var(--shadow);
  }

  .cell {
    background: #F0EFEB;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    transition: transform 0.12s, background 0.15s, box-shadow 0.15s;
    position: relative;
    border: 2px solid transparent;
  }

  .cell:active { transform: scale(0.94); }
  .cell:active.no-click { transform: none; cursor: default; }

  .cell.has-cat {
    animation: pop-in 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes pop-in {
    0% { transform: scale(0); }
    100% { transform: scale(1); }
  }

  .cell.selected {
    border-color: var(--highlight);
    box-shadow: inset 0 0 0 2px var(--highlight);
    background: #FFFDF0;
  }

  .cell.wrong {
    background: var(--error) !important;
    animation: shake 0.4s;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  .cell.revealed-hint {
    background: #FFF9C4 !important;
    border-color: #FFD54F;
  }

  .cell .cat-emoji {
    font-size: 1.3rem;
    line-height: 1;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.15));
  }

  /* ── Controls ── */
  .controls {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    background: #FFFFFF;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 2px 6px var(--shadow);
    transition: transform 0.12s, box-shadow 0.12s, background 0.12s;
    display: flex;
    align-items: center;
    gap: 5px;
    color: var(--text);
  }

  .btn:active { transform: scale(0.95); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .btn.primary {
    background: var(--accent);
    color: #fff;
  }

  .btn.secondary {
    background: #E0E0E0;
  }

  .btn.danger {
    background: #EF9A9A;
    color: #fff;
  }

  /* ── Rules panel ── */
  .rules {
    margin-top: 14px;
    background: #FFFFFF;
    border-radius: 12px;
    padding: 12px 14px;
    max-width: 400px;
    width: 100%;
    font-size: 0.75rem;
    line-height: 1.5;
    color: #555;
    box-shadow: 0 2px 8px var(--shadow);
  }

  .rules h3 {
    font-size: 0.8rem;
    color: #444;
    margin-bottom: 6px;
  }

  .rules ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .rules li::before {
    content: "🐾 ";
  }

  /* ── Overlay ── */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    animation: fade-in 0.3s;
  }

  .overlay.show { display: flex; }

  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal {
    background: white;
    border-radius: 16px;
    padding: 28px 32px;
    text-align: center;
    max-width: 300px;
    width: 90%;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    animation: modal-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes modal-in {
    from { transform: scale(0.8) translateY(20px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }

  .modal .big-emoji { font-size: 3rem; margin-bottom: 8px; }
  .modal h2 { font-size: 1.3rem; margin-bottom: 6px; }
  .modal p { font-size: 0.85rem; color: #888; margin-bottom: 18px; line-height: 1.5; }

  /* ── Responsive ── */
  @media (max-width: 380px) {
    h1 { font-size: 1.2rem; }
    .pill { font-size: 0.75rem; padding: 4px 10px; }
    .cell { font-size: 1.1rem; }
    .cell .cat-emoji { font-size: 1rem; }
  }
</style>
</head>
<body>

<h1>🐱 貓咪星球</h1>
<p class="subtitle">貓咪尋找謎題 · 踩地雷改版</p>

<!-- Top bar -->
<div class="top-bar">
  <div class="pill">
    🐱 <span class="count" id="foundCount">0</span>
    <span style="color:#999">/ 8</span>
  </div>
  <div class="pill">
    <span class="hearts" id="hearts">
      <span class="heart">❤️</span>
      <span class="heart">❤️</span>
      <span class="heart">❤️</span>
    </span>
  </div>
</div>

<!-- Board -->
<div class="board-wrapper">
  <div class="board" id="board"></div>
</div>

<!-- Controls -->
<div class="controls">
  <button class="btn secondary" id="resetBtn">🔄 重置</button>
  <button class="btn primary" id="confirmBtn" disabled>✅ 確認</button>
  <button class="btn secondary" id="hintBtn">💡 提示</button>
</div>

<!-- Rules -->
<div class="rules">
  <h3>📜 規則</h3>
  <ul>
    <li>每行（row）淨得一隻貓</li>
    <li>每列（column）淨得一隻貓</li>
    <li>每個顏色區域淨得一隻貓</li>
    <li>貓之間 8 方向都唔得挨近（包括斜角）</li>
    <li>點格揀選 → 再點「確認」或同一格揸第二次先探測</li>
  </ul>
</div>

<!-- Overlays -->
<div class="overlay" id="winOverlay">
  <div class="modal">
    <div class="big-emoji">🎉</div>
    <h2>全揾晒！</h2>
    <p>你成功揾咗 8 隻貓，符合所有規則！</p>
    <button class="btn primary" id="playAgainWinBtn">🔄 再玩一次</button>
  </div>
</div>

<div class="overlay" id="loseOverlay">
  <div class="modal">
    <div class="big-emoji">😿</div>
    <h2>心機光咗...</h2>
    <p>你已經噎了 3 次， forfeit 喇。再試一次！</p>
    <button class="btn danger" id="playAgainLoseBtn">🔄 再玩一次</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// 貓咪星球 · 貓咪尋找謎題 (v1)
// 8x8 顏色區域網格，玩家根據行/列/色區約束探測貓位置
// ═══════════════════════════════════════════════════════════════

const GRID = 8;
const TOTAL_CATS = 8;
const MAX_HEARTS = 3;

const COLORS = [
  { id: 'teal',      hex: '#4ECDC4', bg: '#E0F2F1' },
  { id: 'lightblue', hex: '#7EC8E3', bg: '#E3F2FD' },
  { id: 'rosy',      hex: '#F7B7A3', bg: '#FCE4EC' },
  { id: 'purple',    hex: '#C9B1FF', bg: '#F3E5F5' },
  { id: 'green',     hex: '#B5EAD7', bg: '#E8F5E9' },
  { id: 'blue',      hex: '#6CACE4', bg: '#E1F5FE' },
  { id: 'pink',      hex: '#FFB7C5', bg: '#FCE4EC' },
  { id: 'yellow',    hex: '#FFD93D', bg: '#FFF8E1' },
];

const CAT_EMOJI = '🐱';
const WRONG_EMOJI = '✖';

// ── State ──
let colorGrid = [];       // 8x8: 每格的顏色索引 (0-7)
let catPositions = [];    // [[r,c], ...] 貓嘅真實位置
let catColorMap = {};     // "r,c" -> color index
let foundPositions = [];  // 已揾到嘅貓位置
let hearts = MAX_HEARTS;
let selectedCell = null;  // {r, c} 或 null
let gameOver = false;
let moveCount = 0;

// ── DOM ──
const boardEl = document.getElementById('board');
const foundCountEl = document.getElementById('foundCount');
const heartsEl = document.getElementById('hearts');
const confirmBtn = document.getElementById('confirmBtn');
const resetBtn = document.getElementById('resetBtn');
const hintBtn = document.getElementById('hintBtn');
const winOverlay = document.getElementById('winOverlay');
const loseOverlay = document.getElementById('loseOverlay');

// ── Helpers ──
function key(r, c) { return r + ',' + c; }

function isAdjacent(p1, p2) {
  return Math.abs(p1[0] - p2[0]) <= 1 && Math.abs(p1[1] - p2[1]) <= 1;
}

// 生成一組有效嘅貓位置（每行1、每列1、8方向不挨近）
function generateValidCats() {
  for (let attempt = 0; attempt < 5000; attempt++) {
    let cols = [0,1,2,3,4,5,6,7];
    // Fisher-Yates shuffle
    for (let i = cols.length - 1; i > 0; i--) {
      let j = Math.floor(Math.random() * (i + 1));
      [cols[i], cols[j]] = [cols[j], cols[i]];
    }
    let positions = cols.map((c, r) => [r, c]);
    let valid = true;
    for (let i = 0; i < positions.length && valid; i++) {
      for (let j = i + 1; j < positions.length; j++) {
        if (isAdjacent(positions[i], positions[j])) {
          valid = false;
          break;
        }
      }
    }
    if (valid) return positions;
  }
  // fallback（保證至少一組有效解）
  return [[0,0],[1,2],[2,4],[3,6],[4,1],[5,3],[6,5],[7,7]];
}

// 根據貓位置生成顏色區域（每個色區恰好包含一隻貓， colours 連成區域）
function generateColorGrid(catPositions) {
  // 初始化 grid
  let grid = Array.from({ length: GRID }, () => Array(GRID).fill(-1));
  
  // 分配顏色給貓（0-7）
  let catColorAssignments = {};
  for (let i = 0; i < catPositions.length; i++) {
    let [r, c] = catPositions[i];
    let colorIdx = i % COLORS.length;
    grid[r][c] = colorIdx;
    catColorMap[key(r, c)] = colorIdx;
  }
  
  // BFS 擴展：由貓位置開始擴散，將空格分配給 nearby 嘅貓色區
  let queue = [];
  for (let r = 0; r < GRID; r++) {
    for (let c = 0; c < GRID; c++) {
      if (grid[r][c] !== -1) queue.push([r, c]);
    }
  }
  
  // 重新洗順序，避免某隻貓先擴展而霸佔太多
  for (let i = queue.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [queue[i], queue[j]] = [queue[j], queue[i]];
  }
  
  let head = 0;
  while (head < queue.length) {
    let [r, c] = queue[head++];
    let color = grid[r][c];
    // 4 方向擴展（保持區域連通性）
    for (let [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
      let nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < GRID && nc >= 0 && nc < GRID && grid[nr][nc] === -1) {
        grid[nr][nc] = color;
        queue.push([nr, nc]);
      }
    }
  }
  
  return grid;
}

// 初始化遊戲
function initGame() {
  catPositions = generateValidCats();
  catColorMap = {};
  colorGrid = generateColorGrid(catPositions);
  foundPositions = [];
  hearts = MAX_HEARTS;
  selectedCell = null;
  gameOver = false;
  moveCount = 0;
  winOverlay.classList.remove('show');
  loseOverlay.classList.remove('show');
  renderBoard();
  renderHearts();
  updateFoundCount();
  confirmBtn.disabled = true;
}

// ── Render ──
function renderBoard() {
  boardEl.innerHTML = '';
  for (let r = 0; r < GRID; r++) {
    for (let c = 0; c < GRID; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r;
      cell.dataset.c = c;
      
      const colorIdx = colorGrid[r][c];
      if (colorIdx !== undefined && colorIdx >= 0) {
        cell.style.background = COLORS[colorIdx].bg;
      }
      
      const isFound = foundPositions.some(p => p[0] === r && p[1] === c);
      const isCat = catPositions.some(p => p[0] === r && p[1] === c);
      const isSelected = selectedCell && selectedCell.r === r && selectedCell.c === c;
      
      if (isFound) {
        cell.classList.add('has-cat');
        cell.innerHTML = `<span class="cat-emoji">${CAT_EMOJI}</span>`;
        cell.style.background = COLORS[catColorMap[key(r,c)]].hex;
        cell.style.cursor = 'default';
      } else if (gameOver) {
        cell.style.cursor = 'default';
        // 顯示揾過但錯誤嘅格（如果有）
      }
      
      if (isSelected && !isFound) {
        cell.classList.add('selected');
      }
      
      // 之前錯誤探測過嘅格（暫時保留標記）
      // 我們用一個独立集合追蹤錯誤格
      cell.addEventListener('click', () => onCellClick(r, c));
      boardEl.appendChild(cell);
    }
  }
  // 劃掉錯誤格（keep track 用 set，再 render 一次標記）
  renderWrongGuesses();
}

// 追蹤錯誤格（避免每次 render 都抹殺）
let wrongGuesses = [];

function renderWrongGuesses() {
  const cells = boardEl.querySelectorAll('.cell');
  cells.forEach(cell => {
    const r = +cell.dataset.r;
    const c = +cell.dataset.c;
    const isWrong = wrongGuesses.some(w => w.r === r && w.c === c);
    if (isWrong && !foundPositions.some(p => p[0] === r && p[1] === c)) {
      cell.classList.add('wrong');
      if (!cell.querySelector('.cat-emoji')) {
        cell.innerHTML = `<span style="font-size:1.1rem;opacity:0.7">✖</span>`;
      }
    }
  });
}

function renderHearts() {
  heartsEl.innerHTML = '';
  for (let i = 0; i < MAX_HEARTS; i++) {
    const h = document.createElement('span');
    h.className = 'heart' + (i >= hearts ? ' lost' : '');
    h.textContent = '❤️';
    heartsEl.appendChild(h);
  }
}

function updateFoundCount() {
  foundCountEl.textContent = foundPositions.length;
  foundCountEl.className = 'count' + (foundPositions.length === TOTAL_CATS ? ' green' : '');
}

// ── Interaction ──
function onCellClick(r, c) {
  if (gameOver) return;
  
  const isFound = foundPositions.some(p => p[0] === r && p[1] === c);
  if (isFound) return; // 已揾到嘅格唔得再點
  
  if (!selectedCell) {
    // 第一次點：揀選
    selectedCell = { r, c };
    confirmBtn.disabled = false;
    renderBoard();
    return;
  }
  
  if (selectedCell.r === r && selectedCell.c === c) {
    // 同一格第二次點：確認探測
    probeCell(r, c);
  } else {
    // 換一格揀選
    selectedCell = { r, c };
    confirmBtn.disabled = false;
    renderBoard();
  }
}

function probeCell(r, c) {
  if (gameOver) return;
  if (foundPositions.some(p => p[0] === r && p[1] === c)) return;
  
  moveCount++;
  const isCat = catPositions.some(p => p[0] === r && p[1] === c);
  
  if (isCat) {
    // 正確！
    foundPositions.push([r, c]);
    selectedCell = null;
    confirmBtn.disabled = true;
    renderBoard();
    updateFoundCount();
    
    // 動畫提示已揾到
    const cellEl = boardEl.querySelector(`[data-r="${r}"][data-c="${c}"]`);
    if (cellEl) {
      cellEl.classList.add('has-cat');
    }
    
    // 檢查勝利
    if (foundPositions.length === TOTAL_CATS) {
      gameOver = true;
      setTimeout(() => {
        winOverlay.classList.add('show');
      }, 350);
    }
  } else {
    // 錯誤！
    hearts--;
    wrongGuesses.push({ r, c });
    renderHearts();
    renderBoard();
    
    if (hearts <= 0) {
      gameOver = true;
      confirmBtn.disabled = true;
      selectedCell = null;
      setTimeout(() => {
        loseOverlay.classList.add('show');
      }, 400);
    }
  }
}

function confirmSelection() {
  if (!selectedCell || gameOver) return;
  probeCell(selectedCell.r, selectedCell.c);
}

// 提示：顯示一個未揾到嘅貓位置
function useHint() {
  if (gameOver) return;
  const unfound = catPositions.filter(p => !foundPositions.some(f => f[0] === p[0] && f[1] === p[1]));
  if (unfound.length === 0) return;
  
  const target = unfound[Math.floor(Math.random() * unfound.length)];
  const [r, c] = target;
  
  // 高亮提示 1.2 秒，然後永久顯示貓
  const cellEl = boardEl.querySelector(`[data-r="${r}"][data-c="${c}"]`);
  if (cellEl) {
    cellEl.classList.add('revealed-hint');
    setTimeout(() => {
      if (!foundPositions.some(p => p[0] === r && p[1] === c)) {
        foundPositions.push([r, c]);
        renderBoard();
        updateFoundCount();
        if (foundPositions.length === TOTAL_CATS) {
          gameOver = true;
          setTimeout(() => winOverlay.classList.add('show'), 350);
        }
      }
    }, 1200);
  }
}

// ── Reset ──
function resetGame() {
  initGame();
}

// ── Event Listeners ──
confirmBtn.addEventListener('click', confirmSelection);
resetBtn.addEventListener('click', resetGame);
hintBtn.addEventListener('click', useHint);
document.getElementById('playAgainWinBtn').addEventListener('click', resetGame);
document.getElementById('playAgainLoseBtn').addEventListener('click', resetGame);

// 鍵盤支持：Enter 確認
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !confirmBtn.disabled && !gameOver) {
    confirmSelection();
  }
});

// ── Start ──
initGame();
</script>
</body>
</html>
